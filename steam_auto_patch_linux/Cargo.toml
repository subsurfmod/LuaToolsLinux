[package]
name = "steam-auto-patch-linux"
version = "4.1.6"
edition = "2021"
description = "Native Linux implementation of SteamAutoPatch (Goldberg Steam emulator deployment)"
license = "GPL-3.0-or-later"

[lib]
name = "steam_auto_patch_linux"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
configparser = "3.3"
dirs = "6.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
walkdir = "2.4"
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3.14"
