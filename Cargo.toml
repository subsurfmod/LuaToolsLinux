[workspace]
members = [".", "bridge_lib", "steam_auto_patch_linux"]

[package]
name = "luatools-linux"
version = "2.9.1-beta"
edition = "2021"
description = "Native lightweight Rust workstation for Steam stplug-in lua manifests, LuaVault variants, depot downloads, and game fixes"
license = "MIT"
authors = ["LuaTools Linux Contributors"]

[[bin]]
name = "luatools"
path = "src/main.rs"

[lib]
name = "luatools_linux"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
serde_yml = "0.0.12"

ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tiny_http = "0.12"
tungstenite = { version = "0.26", default-features = false }
url = "2.5"
urlencoding = "2.1"

sha2 = "0.10"
sha1 = "0.10"
md5 = "0.8"
base64 = "0.22"
hex = "0.4"
thiserror = "2.0"
toml = "0.8"
log = "0.4"
libc = "0.2"
inotify = "0.10"
rand = "0.8"
walkdir = "2.4"
regex = "1.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6.0"
bytes = "1.8"

zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
steam-auto-patch-linux = { path = "steam_auto_patch_linux" }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.debug-debug]
inherits = "release"
debug = 2
strip = false
panic = "unwind"
