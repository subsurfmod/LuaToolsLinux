[package]
name = "bridge_lib"
version = "4.1.5"
edition = "2021"
description = "Steam client integration shared library (LD_PRELOAD) for Linux"
license = "GPL-3.0-or-later"

[lib]
name = "steam_integration"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
luatools-linux = { path = "..", default-features = false }
libc = "0.2"
serde_json = "1.0"
dirs = "6.0"
ctor = "0.1"
